<div class="row justify-content-center">
  <div class="col-md-8">
    <h3>New forum section</h3>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="sectionName">Name</label>
        <input id="sectionName" type="text" class="form-control" formControlName="name" maxlength="100">
      </div>
      <div class="form-group">
        <label for="sectionDescription">Description</label>
        <textarea id="sectionDescription" class="form-control" rows="3" formControlName="description" maxlength="500"></textarea>
      </div>
      <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
      <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm mr-1" role="status" aria-hidden="true"></span>
        {{ isSubmitting ? 'Creating…' : 'Create section' }}
      </button>
    </form>
  </div>
</div>
