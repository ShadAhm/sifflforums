<div class="row justify-content-center">
  <div class="col-md-6">
    <h3>{{ isRegister ? 'Register' : 'Login' }}</h3>
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">{{ isRegister ? 'Email' : 'Email or username' }}</label>
        <input id="email" [attr.type]="isRegister ? 'email' : 'text'" class="form-control" formControlName="email" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" class="form-control" formControlName="password" [attr.autocomplete]="isRegister ? 'new-password' : 'current-password'">
      </div>
      <div class="form-group" *ngIf="isRegister">
        <label for="confirmPassword">Confirm password</label>
        <input id="confirmPassword" type="password" class="form-control" formControlName="confirmPassword" autocomplete="new-password">
      </div>
      <div class="alert alert-danger" *ngIf="errorMessage">{{ errorMessage }}</div>
      <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm mr-1" role="status" aria-hidden="true"></span>
        <ng-container *ngIf="!isSubmitting">{{ isRegister ? 'Register' : 'Login' }}</ng-container>
        <ng-container *ngIf="isSubmitting">{{ isRegister ? 'Registering…' : 'Logging in…' }}</ng-container>
      </button>
    </form>
    <p class="mt-3" *ngIf="!isRegister">
      No account yet? <a [routerLink]="'/' + applicationPaths.Register" [queryParams]="{ returnUrl: returnUrl }">Register</a>
    </p>
    <p class="mt-3" *ngIf="isRegister">
      Already registered? <a [routerLink]="'/' + applicationPaths.Login" [queryParams]="{ returnUrl: returnUrl }">Login</a>
    </p>
  </div>
</div>
